<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Protein Tracker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="card">
        <p class="eyebrow">Protein Tracker</p>
        <h1>Quem está usando?</h1>

        {% if usuarios %}
        <ul class="user-list">
            {% for u in usuarios %}
            <li>
                <a href="{{ url_for('selecionar_usuario', usuario_id=u['id']) }}" class="user-item">
                    <span class="user-name">{{ u['nome'] }}</span>
                    <span class="user-meta mono">{{ u['objetivo'] }}</span>
                </a>
            </li>
            {% endfor %}
        </ul>
        {% else %}
        <p>Nenhum usuário cadastrado ainda. Crie o primeiro abaixo.</p>
        {% endif %}

        <hr class="divider">

        <h2>Criar novo usuário</h2>

        {% if erro %}
        <p class="erro">{{ erro }}</p>
        {% endif %}

        <form method="POST" class="form">
            <label for="nome">Nome</label>
            <input type="text" id="nome" name="nome" required autofocus>

            <label for="peso">Peso (kg)</label>
            <input type="number" id="peso" name="peso" step="0.1" min="0" required>

            <label for="objetivo">Objetivo</label>
            <select id="objetivo" name="objetivo" required>
                <option value="manutencao">Manutenção</option>
                <option value="ganho de massa">Ganho de massa</option>
                <option value="perda de gordura">Perda de gordura</option>
            </select>

            <button type="submit">Criar e começar</button>
        </form>
    </main>
</body>
</html>
